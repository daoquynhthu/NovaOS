[package]
name = "fs_server"
version = "0.1.0"
edition = "2021"
authors = ["NovaOS Team"]
description = "NovaOS file system service"

# Inherit workspace lints but allow dead_code (shared code via include!() from rootserver
# contains items only used by rootserver). TODO(Phase2): Remove when shared code extracted.
[lints]
workspace = true

[dependencies]
libnova = { path = "../../libs/libnova" }
sel4-sys = { path = "../../libs/seL4-sys" }
linked_list_allocator = "0.10.5"
spin = "0.9.8"

[[bin]]
name = "fs_server"
path = "src/main.rs"
harness = false
